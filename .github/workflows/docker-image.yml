name: Build and push container image

# Builds the static site into a container image and pushes it to GHCR so the
# root server can pull and serve it. Runs alongside the existing GitHub Pages
# deployment (which is unaffected).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/viseit/agrar-assistent:latest
            ghcr.io/viseit/agrar-assistent:${{ github.sha }}
